# Netlify deployment configuration for SRT Demon — TanStack Start (SSR via Nitro)
#
# How the Nitro "netlify" preset works:
#   dist/                              → static assets  (this is the publish dir)
#   .netlify/functions-internal/server → SSR serverless function (auto-detected by Netlify)
#
# Netlify picks up .netlify/functions-internal/ automatically — no manual function config needed.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Signals vite.config.ts to activate the Netlify Nitro preset.
  # Netlify also sets this automatically in CI — listing it here ensures local
  # `netlify build` runs work too.
  NETLIFY = "true"

# Route all unmatched requests to the SSR function so TanStack Router handles
# every path correctly (deep links, refreshes, back/forward).
[[redirects]]
  from   = "/*"
  to     = "/.netlify/functions/server"
  status = 200
  # Do NOT rewrite hashed static assets — let Netlify serve them directly.
  force  = false

# ── Cache headers ────────────────────────────────────────────────────────────

# Hashed JS/CSS assets — safe to cache permanently
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Frame sequence images (480 files, ~60MB) — immutable until next deploy
[[headers]]
  for = "/car1/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/car2/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers on all responses
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
